name: Test and build on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build the Android app
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Get the build artifact URL
        id: artifact
        run: |
          URL=$(eas build:list --platform android --profile preview --status finished --limit 1 --json --non-interactive | node -e "
            let data = '';
            process.stdin.on('data', (chunk) => data += chunk);
            process.stdin.on('end', () => {
              const builds = JSON.parse(data);
              console.log(builds[0].artifacts.applicationArchiveUrl);
            });
          ")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download the build artifact
        run: curl -L -o ./volunteam.apk "${{ steps.artifact.outputs.url }}"

      - name: Attach the build to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ./volunteam.apk
